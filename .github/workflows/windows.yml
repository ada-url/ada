name: Windows

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # MSVC builds (use Visual Studio generator for native MSVC support)
  msvc:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { build_type: Release, shared: OFF, arch: x64, cmake_args: '' }
          - { build_type: Debug, shared: OFF, arch: x64, cmake_args: '-DADA_DEVELOPMENT_CHECKS=ON' }
          - { build_type: Debug, shared: ON, arch: x64, cmake_args: '-DADA_DEVELOPMENT_CHECKS=ON' }
    name: msvc (${{ matrix.build_type }}, shared=${{ matrix.shared }})
    uses: ./.github/workflows/_build.yaml
    with:
      # windows-2025 ships Visual Studio 2026 (v18), so we run MSVC builds on
      # that image and use the matching Visual Studio generator below.
      # The 'Visual Studio 18 2026' generator requires CMake >= 4.2; optionally
      # pin CMake via cmake_version for determinism / to enforce that minimum.
      # (cmake_version is opt-in; other jobs keep the runner default CMake)
      runner: windows-2025
      generator: 'Visual Studio 18 2026'
      cmake_version: '4.2.6'
      arch: ${{ matrix.arch }}
      shared: ${{ matrix.shared }}
      build_type: ${{ matrix.build_type }}
      cmake_args: ${{ matrix.cmake_args }}

  # ClangCL builds
  clangcl:
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    name: clangcl (${{ matrix.build_type }})
    uses: ./.github/workflows/_build.yaml
    with:
      runner: windows-2025
      build_type: ${{ matrix.build_type }}
      # windows-2025 ships LLVM 20.1.8. The VS 2026 MSVC STL refuses anything
      # older than Clang 22 (error STL1000). Install LLVM 22 ahead of configure
      # and put it first on PATH so clang-cl resolves to that build.
      setup_script: |
        pwsh -NoProfile -Command '
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-win64.exe"
          $exe = Join-Path $env:RUNNER_TEMP "LLVM-22.1.8-win64.exe"
          Invoke-WebRequest -Uri $url -OutFile $exe
          $p = Start-Process -FilePath $exe -ArgumentList "/S","/D=C:\LLVM-22" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "LLVM installer exited $($p.ExitCode)" }
          & "C:\LLVM-22\bin\clang-cl.exe" --version
          Add-Content -Path $env:GITHUB_PATH -Value "C:\LLVM-22\bin"
        '
      cmake_args: '-DADA_DEVELOPMENT_CHECKS=ON -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl'
