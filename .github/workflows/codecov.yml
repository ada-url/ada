name: Code Coverage

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: coverage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: sudo apt-get update -y && sudo apt-get install -y gcovr ninja-build

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_CXX_COMPILER=g++-12
          -DADA_TESTING=ON
          -DADA_COVERAGE=ON
          -DADA_DEVELOPMENT_CHECKS=ON

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --output-on-failure --test-dir build

      # Exception edges on std::string and operator new are not taken in tests.
      # Counting them as missed branches marks executed lines partial and pulls
      # patch coverage under the 60% gate for ordinary copies. Keep this comment
      # outside the folded run script: a '#' there is a shell comment and drops
      # the rest of the gcovr command, including --xml.
      - name: Generate coverage report
        run: >
          gcovr
          --root .
          --exclude 'build/_deps/.*'
          --exclude 'build/dependencies/.*'
          --exclude 'dependencies/.*'
          --exclude 'tools/.*'
          --exclude 'singleheader/.*'
          --exclude 'benchmarks/.*'
          --exclude 'tests/.*'
          --exclude 'include/ada/expected.h'
          --exclude-throw-branches
          --gcov-executable gcov-12
          --xml
          --output build/coverage.xml

      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: build/coverage.xml
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
